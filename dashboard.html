<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>MathFlow — Dashboard Guru</title>
<style>
:root{--bg:#071426;--panel:#10213a;--panel2:#173254;--text:#f4f8ff;--muted:#b6c7dd;--line:#2c4b70;--a:#63e6ff;--b:#a78bfa;--good:#67e8a5;--gold:#ffd166;--pink:#ff7ab6}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0%,#63e6ff22,transparent 28%),radial-gradient(circle at 10% 90%,#a78bfa20,transparent 30%),linear-gradient(135deg,#071426,#0b1730 55%,#081322);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
.wrap{max-width:1240px;margin:auto}header{background:#071426cc;border-bottom:1px solid var(--line);backdrop-filter:blur(14px);padding:24px 18px;position:sticky;top:0;z-index:5}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}.top h1{margin:0;font-size:clamp(27px,5vw,42px);letter-spacing:-.04em}.top p{margin:7px 0 0;color:var(--muted)}
.live{border:1px solid #31557e;border-radius:99px;padding:9px 13px;color:var(--a);background:#0d2139;font-size:13px;font-weight:800;box-shadow:0 8px 25px #0003}.online{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--good);margin-right:6px;box-shadow:0 0 10px #67e8a5}
main{max-width:1240px;margin:auto;padding:24px 18px 55px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}.stat{background:linear-gradient(145deg,#142a48f5,#0b1a30f5);border:1px solid #315075;border-radius:20px;padding:18px;box-shadow:0 18px 45px #0004;position:relative;overflow:hidden}.stat:after{content:'✦';position:absolute;right:16px;top:10px;color:#63e6ff44;font-size:28px}.stat b{font-size:30px;display:block;letter-spacing:-.03em}.stat span{font-size:13px;color:var(--muted)}
.panel{background:linear-gradient(145deg,#142a48f5,#0b1a30f5);border:1px solid #315075;border-radius:22px;padding:18px;box-shadow:0 20px 55px #0004;margin-bottom:16px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.toolbar input,.toolbar select{padding:11px 13px;border:1px solid #315075;border-radius:12px;background:#08172b;color:#fff;font:inherit;outline:0}.toolbar input{min-width:250px}.toolbar input:focus,.toolbar select:focus{border-color:var(--a);box-shadow:0 0 0 3px #63e6ff14}button{border:1px solid #31557e;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer;background:#173254;color:#dff8ff;transition:.18s}button:hover{background:#214267;transform:translateY(-1px)}
.tablewrap{overflow:auto;border:1px solid #263f61;border-radius:16px}table{width:100%;border-collapse:collapse;min-width:930px}th,td{padding:13px 10px;border-bottom:1px solid #203957;text-align:left;vertical-align:middle}th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:#0b1b31;position:sticky;top:0}td{font-size:14px}tbody tr:hover{background:#ffffff06}.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900;border:1px solid transparent}.done{background:#67e8a514;color:var(--good);border-color:#67e8a52b}.wait{background:#ffd16612;color:var(--gold);border-color:#ffd1662b}.lock{background:#b6c7dd10;color:var(--muted);border-color:#b6c7dd22}.members{font-size:12px;color:var(--muted);line-height:1.5}.time{white-space:nowrap;font-size:12px;color:var(--muted)}.empty{text-align:center;padding:40px;color:var(--muted)}
.detail{display:none;background:#08172b;border:1px solid #315075;border-radius:16px;padding:16px;margin-top:14px}.detail.show{display:block}.detailgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.kv{background:#10213a;border:1px solid #2c4b70;border-radius:12px;padding:11px}.kv small{color:var(--muted);display:block}.kv b{display:block;margin-top:3px;color:#f4f8ff}
@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.detailgrid{grid-template-columns:1fr}}@media(max-width:480px){.cards{grid-template-columns:1fr 1fr}.toolbar input{min-width:100%;width:100%}.top h1{font-size:28px}}
</style>
</head>
<body>
<header><div class="wrap top"><div><div style="color:var(--a);font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase">MATHFLOW · POJOK KREATIF</div><h1>📊 Dashboard Perjalanan</h1><p>Pantau perjalanan belajar setiap kelompok secara realtime.</p></div><div class="live" id="connection">● Menghubungkan Firebase...</div></div></header>
<main>
<div class="cards">
 <div class="stat"><b id="total">0</b><span>Total kelompok</span></div>
 <div class="stat"><b id="active">0</b><span>Sedang berjalan</span></div>
 <div class="stat"><b id="finished">0</b><span>Selesai</span></div>
 <div class="stat"><b id="fastest">—</b><span>Kelompok tercepat masuk</span></div>
</div>
<div class="panel">
 <div class="toolbar">
  <input id="search" placeholder="Cari nama kelompok...">
  <select id="filter"><option value="all">Semua progress</option><option value="Discover">Discover</option><option value="Explore">Explore</option><option value="Concept">Concept</option><option value="Gerbang 1">Gerbang 1</option><option value="Gerbang 2">Gerbang 2</option><option value="Gerbang 3">Gerbang 3</option><option value="Gerbang 4">Gerbang 4</option><option value="Final Quest">Final Quest</option><option value="Selesai">Selesai</option></select>
  <button onclick="sortNewest()">↕ Terbaru</button>
  <button onclick="resetDashboard()" style="border-color:#7f334f;background:#351526;color:#ff9fc3">🗑️ Reset Data</button>
 </div>
</div>
<div class="panel">
 <div class="tablewrap">
 <table><thead><tr><th>Kelompok</th><th>Anggota</th><th>Progress</th><th>G1</th><th>G2</th><th>G3</th><th>G4</th><th>Final</th><th>Kode</th><th>Update</th><th></th></tr></thead>
 <tbody id="rows"><tr><td colspan="11" class="empty">Menunggu data kelompok...</td></tr></tbody></table>
 </div>
 <div id="detail" class="detail"></div>
</div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyDOEEE_Mr53KLRsiUH8nRZWfxLystSFOmA",
 authDomain:"mathflow-3e648.firebaseapp.com",
 databaseURL:"https://mathflow-3e648-default-rtdb.asia-southeast1.firebasedatabase.app/",
 projectId:"mathflow-3e648",
 storageBucket:"mathflow-3e648.firebasestorage.app",
 messagingSenderId:"530609001743",
 appId:"1:530609001743:web:a7ec3d2fdf84b372109a7a"
};
const app=initializeApp(firebaseConfig),db=getDatabase(app);
let allData={},newestFirst=true;

const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const badge=(ok)=>ok?'<span class="badge done">✓</span>':'<span class="badge lock">—</span>';

function render(){
 const q=document.getElementById('search').value.toLowerCase().trim();
 const filter=document.getElementById('filter').value;
 let arr=Object.entries(allData).map(([id,d])=>({id,...d}));
 arr=arr.filter(d=>(!q||(d.nama||'').toLowerCase().includes(q))&&(filter==='all'||d.progress===filter));
 arr.sort((a,b)=>{
   const aa=Number(a.waktuTerakhir)||0,bb=Number(b.waktuTerakhir)||0;
   return newestFirst?bb-aa:aa-bb;
 });
 const total=Object.keys(allData).length;
 const finished=Object.values(allData).filter(x=>x.progress==='Selesai').length;
 document.getElementById('total').textContent=total;
 document.getElementById('active').textContent=total-finished;
 document.getElementById('finished').textContent=finished;

 const entered=Object.entries(allData).filter(([id,d])=>d.secretCode);
 if(entered.length){
   entered.sort((a,b)=>(Number(a[1].waktuTerakhir)||Infinity)-(Number(b[1].waktuTerakhir)||Infinity));
   document.getElementById('fastest').textContent=entered[0][1].nama||'—';
 }else document.getElementById('fastest').textContent='—';

 const rows=document.getElementById('rows');
 if(!arr.length){rows.innerHTML='<tr><td colspan="11" class="empty">Belum ada kelompok yang cocok.</td></tr>';return}
 rows.innerHTML=arr.map(d=>{
  const members=(d.anggota||[]).map(esc).filter(Boolean).join(', ');
  const final=d.finalQuest?.selesai;
  return `<tr>
   <td><b>${esc(d.nama||'Tanpa nama')}</b><br><small>${esc(d.id)}</small></td>
   <td><div class="members">${members||'—'}</div></td>
   <td><span class="badge ${d.progress==='Selesai'?'done':'wait'}">${esc(d.progress||'Belum mulai')}</span></td>
   <td>${badge(!!d.gerbang1)}</td><td>${badge(!!d.gerbang2)}</td><td>${badge(!!d.gerbang3)}</td><td>${badge(!!d.gerbang4)}</td>
   <td>${badge(!!final)}</td><td><b>${d.secretCode?esc(d.secretCode):'—'}</b></td>
   <td class="time">${formatTime(d.waktuTerakhir)}</td>
   <td><button onclick="showDetail('${esc(d.id)}')">Detail</button></td>
  </tr>`;
 }).join('');
}
function formatTime(v){
 if(!v)return '—';
 const d=new Date(Number(v));
 return isNaN(d)?'—':d.toLocaleString('id-ID',{dateStyle:'short',timeStyle:'medium'});
}
window.showDetail=function(id){
 const d=allData[id];if(!d)return;
 const box=document.getElementById('detail');
 box.classList.add('show');
 box.innerHTML=`<b>Detail: ${esc(d.nama||'')}</b><div class="detailgrid">
 <div class="kv"><small>Progress</small><b>${esc(d.progress||'—')}</b></div>
 <div class="kv"><small>Kode rahasia</small><b>${esc(d.secretCode||'Belum ada')}</b></div>
 <div class="kv"><small>Discover</small><b>${d.discover?.selesai?'Selesai':'Belum'}</b></div>
 <div class="kv"><small>Explore</small><b>${d.explore?.selesai?'Selesai':'Belum'}</b></div>
 <div class="kv"><small>Concept</small><b>${d.concept?.selesai?'Selesai':'Belum'}</b></div>
 <div class="kv"><small>Challenge</small><b>${d.challenge?.selesai?'Selesai (opsional)':'Belum / dilewati'}</b></div>
 <div class="kv"><small>Final Quest</small><b>${d.finalQuest?.selesai?'Selesai':'Belum'}</b></div>
 <div class="kv"><small>Update terakhir</small><b>${formatTime(d.waktuTerakhir)}</b></div>
 </div>`;
 box.scrollIntoView({behavior:'smooth',block:'nearest'});
}
window.sortNewest=function(){newestFirst=!newestFirst;render()}
window.resetDashboard=async function(){
 if(!confirm("⚠️ RESET SEMUA DATA KELOMPOK?\n\nSemua data di Firebase pada mathflow/kelompok akan dihapus dan tidak bisa dibatalkan.")) return;
 const confirmText=prompt("Ketik RESET untuk melanjutkan:");
 if(confirmText!=="RESET"){alert("Reset dibatalkan.");return;}
 try{
   await remove(ref(db,"mathflow/kelompok"));
   allData={}; render();
   document.getElementById("connection").innerHTML="<span class="online"></span>Data berhasil di-reset";
 }catch(err){alert("Gagal mereset data: "+err.message);}
}
document.getElementById('search').addEventListener('input',render);
document.getElementById('filter').addEventListener('change',render);

onValue(ref(db,'mathflow/kelompok'),snap=>{
 allData=snap.val()||{};
 document.getElementById('connection').innerHTML='<span class="online"></span>Realtime aktif';
 render();
},err=>{
 console.error(err);
 document.getElementById('connection').textContent='● Gagal membaca Firebase';
});
</script>
</body>
</html>
