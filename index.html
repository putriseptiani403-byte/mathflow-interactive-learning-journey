<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>MathFlow — Interactive Learning Journey</title>
<style>
:root{--bg:#f5faf9;--card:#fff;--ink:#17323a;--muted:#64777d;--primary:#0f766e;--primary2:#115e59;--accent:#f59e0b;--ok:#15803d;--bad:#b91c1c;--line:#d9e7e4;--shadow:0 12px 35px rgba(23,50,58,.10)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#e9f7f4 0,#f8fbfb 45%,#f5faf9 100%);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);line-height:1.55}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{max-width:1050px;margin:auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;color:var(--primary);letter-spacing:.2px}.pill{font-size:12px;background:#e6f5f2;color:var(--primary2);padding:5px 10px;border-radius:999px;font-weight:800}
main{max-width:1050px;margin:auto;padding:22px 16px 60px}.hero{background:linear-gradient(135deg,#0f766e,#134e4a);color:white;border-radius:24px;padding:28px;box-shadow:var(--shadow);margin-bottom:18px}.hero h1{margin:0 0 8px;font-size:clamp(28px,6vw,48px);line-height:1.05}.hero p{margin:0;max-width:760px;opacity:.92}
.progress{display:flex;gap:7px;overflow:auto;padding:4px 0 15px}.step{min-width:92px;text-align:center;font-size:10px;color:#718287}.dot{width:25px;height:25px;border-radius:50%;margin:0 auto 5px;background:#d9e7e4;display:grid;place-items:center;font-weight:900}.step.active .dot,.step.done .dot{background:var(--primary);color:white}.step.active{color:var(--primary);font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow);margin-bottom:16px}.card h2{margin-top:0}.muted{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
label{display:block;font-weight:800;font-size:14px;margin:10px 0 6px}input,textarea,select{width:100%;border:1px solid #cbdedb;border-radius:12px;padding:12px 13px;font:inherit;background:#fff;color:var(--ink);outline:none}input:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(15,118,110,.12)}
button{border:0;border-radius:12px;padding:12px 17px;font:inherit;font-weight:850;cursor:pointer;background:var(--primary);color:white}button:hover{background:var(--primary2)}button.secondary{background:#e8f2f0;color:var(--primary2)}button.warn{background:#f59e0b;color:#392000}button:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}.actions .right{margin-left:auto;display:flex;gap:10px}
.q{border:1px solid var(--line);border-radius:16px;padding:17px;margin:14px 0;background:#fbfefd}.q h3{margin:0 0 7px;font-size:17px}.choice{display:flex;gap:9px;align-items:flex-start;padding:9px;border:1px solid var(--line);border-radius:11px;margin:7px 0;font-weight:500}.choice input{width:auto;margin-top:5px}
.feedback{margin-top:8px;font-weight:800;font-size:14px}.ok{color:var(--ok)}.bad{color:var(--bad)}.lock{opacity:.62;position:relative}.gate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.gatebox{padding:16px;border:1px solid var(--line);border-radius:16px;text-align:center;background:#fbfefd}.gatebox.done{border-color:#86efac;background:#f0fdf4}.gatebox .big{font-size:28px}
.formula{background:#f0fdfa;border:1px solid #b8e2dc;border-radius:15px;padding:16px;margin:14px 0}.formula code{font-size:18px;font-weight:900;color:var(--primary2)}
.codebox{font-size:30px;letter-spacing:9px;text-align:center;font-weight:950;background:#0f172a;color:#fff;padding:18px;border-radius:16px}.status{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:900;background:#edf7f5;color:var(--primary2)}
.toast{position:fixed;right:16px;bottom:16px;background:#17323a;color:#fff;padding:12px 15px;border-radius:12px;box-shadow:var(--shadow);display:none;z-index:50}
small{font-size:12px;color:var(--muted)}a{color:var(--primary);font-weight:800}
@media(max-width:720px){.grid,.gate{grid-template-columns:1fr}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:22px}.card{padding:17px}.nav{padding:10px 13px}}
</style>
</head>
<body>
<header><div class="nav"><div class="brand">🌿 MathFlow</div><div class="pill" id="cloudStatus">● Menyiapkan koneksi...</div></div></header>
<main>
<section class="hero">
  <h1>MathFlow</h1>
  <p>Interactive Learning Journey menuju <b>Pojok Kreatif Kotabumi</b>. Temukan konsep bunga tunggal, selesaikan empat gerbang, lalu buka misi akhir bersama kelompokmu.</p>
</section>

<div class="progress" id="progress"></div>
<div id="app"></div>
</main>
<div class="toast" id="toast"></div>

<script>
const DEFAULT_STATE={group:'',members:['','','',''],a:{},done:[false,false,false,false],gate:1,code:'',conceptDone:false,firebaseId:''};
let memoryState='';
function storageGet(){try{return localStorage.getItem('mathflow')}catch(e){return memoryState||null}}
function storageSet(v){try{localStorage.setItem('mathflow',v)}catch(e){memoryState=v}}
let S=JSON.parse(storageGet()||JSON.stringify(DEFAULT_STATE));
S.members=S.members||['','','',''];S.a=S.a||{};S.done=S.done||[false,false,false,false];

const stages=[
 ['opening','Opening Mission'],['team','Team'],['discover','Discover'],['explore','Explore'],
 ['concept','Concept'],['gates','The Four Gates'],['challenge','Challenge'],['final','Final Quest'],
 ['code','Secret Code'],['reflect','Reflect']
];
let current='opening';

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>t.style.display='none',2200)}
function tone(kind){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=kind==='ok'?720:180;g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.07,c.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.16);o.start();o.stop(c.currentTime+.18)}catch(e){}}

function firebaseGroupId(){
 if(!S.firebaseId){S.firebaseId='kelompok_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);storageSet(JSON.stringify(S))}
 return S.firebaseId;
}
function firebaseProgress(){
 if(!S.group)return 'Belum mulai';
 if(!S.a.d1||!S.a.d2||!S.a.d3)return 'Discover';
 if(!S.a.e1||!S.a.e2||!S.a.e3)return 'Explore';
 if(!S.conceptDone)return 'Concept';
 if(!S.done[0])return 'Gerbang 1';
 if(!S.done[1])return 'Gerbang 2';
 if(!S.done[2])return 'Gerbang 3';
 if(!S.done[3])return 'Gerbang 4';
 if(!S.a.f1)return 'Final Quest';
 if(!S.code)return 'Secret Code';
 return 'Selesai';
}
function syncFirebase(){
 if(!window.mathflowFirebase||!S.group)return;
 const {db,ref,set,serverTimestamp}=window.mathflowFirebase;
 const id=firebaseGroupId();
 const data={
  nama:S.group,anggota:S.members,progress:firebaseProgress(),
  discover:{selesai:!!(S.a.d1&&S.a.d2&&S.a.d3)},
  explore:{selesai:!!(S.a.e1&&S.a.e2&&S.a.e3)},
  concept:{selesai:!!S.conceptDone},
  gerbang1:!!S.done[0],gerbang2:!!S.done[1],gerbang3:!!S.done[2],gerbang4:!!S.done[3],
  challenge:{selesai:!!(S.a.ch1&&S.a.ch2),opsional:true},
  finalQuest:{selesai:!!S.a.f1,jawaban:S.a.f1||''},
  secretCode:S.code||'',
  waktuTerakhir:serverTimestamp()
 };
 set(ref(db,'mathflow/kelompok/'+id),data).then(()=>setCloud(true)).catch(e=>{console.error(e);setCloud(false)});
}
function setCloud(ok){const x=document.getElementById('cloudStatus');x.textContent=ok?'● Tersinkron Firebase':'● Firebase belum tersambung';x.style.background=ok?'#e7f8ee':'#fff1f2';x.style.color=ok?'#166534':'#b91c1c'}

function saveInputs(){
 document.querySelectorAll('#app input,#app textarea').forEach(x=>{if(x.id)S.a[x.id]=x.type==='radio'?((document.querySelector('input[name="'+x.name+'"]:checked')||{}).value||''):x.value});
 storageSet(JSON.stringify(S));syncFirebase();
}
function badge(){storageSet(JSON.stringify(S));syncFirebase()}
function go(k){current=k;render();window.scrollTo({top:0,behavior:'smooth'})}
function completedBeforeFinal(){return !!(S.group&&S.members.every(x=>x.trim())&&S.a.d1&&S.a.d2&&S.a.d3&&S.a.e1&&S.a.e2&&S.a.e3&&S.conceptDone&&S.done.every(Boolean))}
function canGo(k){
 if(k==='team')return !!S.group;
 if(['discover'].includes(k))return !!(S.group&&S.members.every(x=>x.trim()));
 if(['explore'].includes(k))return !!(S.a.d1&&S.a.d2&&S.a.d3);
 if(['concept'].includes(k))return !!(S.a.e1&&S.a.e2&&S.a.e3);
 if(['gates'].includes(k))return !!S.conceptDone;
 if(['challenge'].includes(k))return !!S.done.every(Boolean);
 if(['final','code','reflect'].includes(k))return completedBeforeFinal();
 return true;
}

function renderProgress(){
 document.getElementById('progress').innerHTML=stages.map((s,i)=>{
  const done=(s[0]==='team'&&S.group&&S.members.every(x=>x.trim()))||
    (s[0]==='discover'&&S.a.d1&&S.a.d2&&S.a.d3)||(s[0]==='explore'&&S.a.e1&&S.a.e2&&S.a.e3)||
    (s[0]==='concept'&&S.conceptDone)||(s[0]==='gates'&&S.done.every(Boolean))||
    (s[0]==='final'&&S.a.f1)||(s[0]==='code'&&S.code)||(s[0]==='reflect'&&S.a.reflection);
  return '<div class="step '+(s[0]===current?'active ':'')+(done?'done':'')+'"><div class="dot">'+(done?'✓':i+1)+'</div>'+esc(s[1])+'</div>'
 }).join('');
}
function nav(next,back=true){return '<div class="actions">'+(back?'<button class="secondary" onclick="historyBack()">← Kembali</button>':'<span></span>')+'<div class="right"><button onclick="go(\''+next+'\')">Lanjut →</button></div></div>'}
function historyBack(){const i=stages.findIndex(x=>x[0]===current);if(i>0)go(stages[i-1][0])}

function render(){
 renderProgress();
 const app=document.getElementById('app');
 const fns={opening:opening,team:team,discover:discover,explore:explore,concept:concept,gates:gates,challenge:challenge,final:final,code:code,reflect:reflect};
 app.innerHTML=fns[current]();
 bindChecks();
}

function opening(){return `<div class="card"><h2>🎯 Opening Mission</h2>
<p>Bayangkan kelompokmu sedang membantu membuat <b>Pojok Kreatif Kotabumi</b>, sebuah ruang untuk memamerkan karya dan ide siswa. Agar rencana dan perhitungannya tepat, kalian akan menggunakan matematika untuk menemukan pola <b>bunga tunggal</b>.</p>
<div class="formula"><b>Misi kalian:</b> temukan konsep dari masalah, buktikan dengan perhitungan, lewati empat gerbang, lalu selesaikan Final Quest.</div>
<p class="muted">Kerjakan sebagai kelompok. Setiap progres akan tercatat otomatis untuk dashboard guru.</p>
${nav('team',false)}</div>`}

function team(){return `<div class="card"><h2>👥 Team</h2><p class="muted">Nama kelompok dan empat anggota wajib diisi sebelum memulai.</p>
<label>Nama Kelompok</label><input id="group" value="${esc(S.group)}" placeholder="Contoh: Kelompok 1">
<div class="grid">${[1,2,3,4].map(i=>`<div><label>Anggota ${i}</label><input id="m${i}" value="${esc(S.members[i-1])}" placeholder="Nama anggota ${i}"></div>`).join('')}</div>
<div class="actions"><span></span><button onclick="teamAndStart()">Mulai Perjalanan →</button></div></div>`}
function teamAndStart(){
 S.group=document.getElementById('group').value.trim();
 S.members=[1,2,3,4].map(i=>document.getElementById('m'+i).value.trim());
 if(!S.group||S.members.some(x=>!x)){alert('Lengkapi nama kelompok dan 4 anggota.');return}
 storageSet(JSON.stringify(S));syncFirebase();toast('Kelompok tersimpan ☁️');go('discover');
}

function qRadio(id,title,prompt,opts,answer){
 const old=S.a[id]||'';
 return `<div class="q"><h3>${title}</h3><p>${prompt}</p>${opts.map((o,i)=>`<label class="choice"><input type="radio" name="${id}" value="${esc(o.v)}" ${old===String(o.v)?'checked':''}>${esc(o.t)}</label>`).join('')}
 <div id="${id}fb" class="feedback"></div></div>`;
}
function bindChecks(){
 const checks={
  d1:'12',d2:'90000',d3:'450000',
  e1:'3000000',e2:'360000',e3:'5',
  ch1:'1.5',ch2:'2.5'
 };
 Object.entries(checks).forEach(([id,ans])=>{
  const el=document.getElementById(id);if(!el)return;
  el.addEventListener('input',()=>checkNum(id,ans));
 });
 document.querySelectorAll('input[type=radio]').forEach(r=>r.addEventListener('change',()=>checkRadio(r.name)));
}
function checkNum(id,ans){
 const el=document.getElementById(id),fb=document.getElementById(id+'fb');if(!el||!fb)return;
 const clean=el.value.trim().replace(/[^\d.-]/g,'');
 if(clean===String(ans)){fb.textContent='✓ Benar';fb.className='feedback ok';tone('ok')}
 else if(clean){fb.textContent='Periksa lagi';fb.className='feedback bad';tone('bad')}
 saveAnswer(id,el.value);
}
function checkRadio(id){
 const el=document.querySelector('input[name="'+id+'"]:checked'),fb=document.getElementById(id+'fb');if(!el||!fb)return;
 const ans={d4:'A',e4:'B'}[id];
 if(el.value===ans){fb.textContent='✓ Benar';fb.className='feedback ok';tone('ok')}else{fb.textContent='Periksa lagi';fb.className='feedback bad';tone('bad')}
 saveAnswer(id,el.value);
}
function saveAnswer(id,v){S.a[id]=v;storageSet(JSON.stringify(S));syncFirebase()}

function discover(){return `<div class="card"><h2>🔎 Discover</h2><p>Perhatikan informasi berikut. Temukan pola sebelum menggunakan rumus.</p>
${numQ('d1','1. Berapa persen bunga dari Rp1.500.000 jika bunganya Rp180.000?','12')}
${numQ('d2','2. Modal Rp3.000.000 mendapat bunga 3% per tahun selama 1 tahun. Berapa bunganya?','90000')}
${numQ('d3','3. Modal Rp3.000.000 mendapat bunga 5% per tahun selama 3 tahun. Berapa total bunganya?','450000')}
${nav('explore')}</div>`}
function numQ(id,prompt,ans){return `<div class="q"><h3>${prompt}</h3><input id="${id}" data-num value="${esc(S.a[id]||'')}" inputmode="decimal" placeholder="Masukkan jawaban"><div id="${id}fb" class="feedback"></div></div>`}

function explore(){return `<div class="card"><h2>🧭 Explore</h2><p>Gunakan pola yang kalian temukan untuk menyelesaikan masalah berikut.</p>
${numQ('e1','1. Modal Rp3.000.000, bunga tunggal 4% per tahun selama 3 tahun. Berapa jumlah akhirnya?','3360000')}
${numQ('e2','2. Modal Rp3.000.000 menjadi Rp3.360.000 dalam 3 tahun. Berapa total bunganya?','360000')}
${numQ('e3','3. Modal Rp2.000.000, jumlah akhir Rp2.600.000, bunga 6% per tahun. Berapa tahun?','5')}
${qRadio('d4','4. Pola bunga tunggal','Bunga setiap periode dihitung dari ...',[{v:'A',t:'modal awal yang tetap'},{v:'B',t:'jumlah akhir periode sebelumnya'},{v:'C',t:'bunga periode sebelumnya'}],'A')}
${nav('concept')}</div>`}

function concept(){return `<div class="card"><h2>💡 Concept</h2><p>Rumus utama bunga tunggal yang kalian temukan:</p>
<div class="formula"><code>B = M₀ × i × n</code><br><small>B = bunga, M₀ = modal awal, i = suku bunga per periode, n = banyak periode.</small></div>
<div class="formula"><code>Mₙ = M₀ + B = M₀(1 + i n)</code><br><small>Mₙ = jumlah akhir; M₀ = modal awal; i = bunga per periode; n = jumlah periode.</small></div>
${qRadio('e4','Cek Konsep','Jika modal Rp2.000.000, i = 5% per tahun, n = 2 tahun, maka bunga adalah ...',[{v:'A',t:'Rp100.000'},{v:'B',t:'Rp200.000'},{v:'C',t:'Rp300.000'}],'B')}
<div class="actions"><span class="muted">Selesaikan cek konsep untuk membuka empat gerbang.</span><button onclick="checkConcept()">Selesaikan Concept →</button></div></div>`}
function checkConcept(){
 const r=document.querySelector('input[name="e4"]:checked');
 if(!r||r.value!=='B'){alert('Cek konsep belum tepat. Periksa lagi.');return}
 S.conceptDone=true;storageSet(JSON.stringify(S));syncFirebase();tone('ok');toast('Concept selesai! Empat gerbang terbuka 🔓');go('gates');
}

function gates(){return `<div class="card"><h2>🚪 The Four Gates</h2><p>Setiap gerbang memiliki satu jejak perhitungan. Selesaikan berurutan.</p>
<div class="gate">${[1,2,3,4].map(n=>`<div class="gatebox ${S.done[n-1]?'done':''}"><div class="big">${S.done[n-1]?'🔓':'🔒'}</div><b>Gerbang ${n}</b><p class="muted">${S.done[n-1]?'Selesai':'Belum selesai'}</p><button ${(!S.done[n-1]&&n!==S.done.findIndex(x=>!x)+1)?'disabled':''} onclick="openGate(${n})">Buka</button></div>`).join('')}</div></div>`}
function openGate(n){
 if(!S.conceptDone)return;
 if(n>1&&!S.done[n-2]){alert('Selesaikan gerbang sebelumnya terlebih dahulu.');return}
 S.gate=n;go('gate'+n);
}
function gatePage(n){
 const data={
 1:{t:'Jejak Jumlah Akhir',p:'Modal awal Rp1.800.000 dengan bunga tunggal 5% per tahun selama 2 tahun. Berapa jumlah akhir?',ans:'1980000',choices:['Rp1.850.000','Rp1.980.000','Rp2.000.000']},
 2:{t:'Jejak Bunga',p:'Modal awal Rp4.000.000 dengan bunga tunggal 3% per tahun selama 4 tahun. Berapa total bunga?',ans:'480000',choices:['Rp360.000','Rp480.000','Rp520.000']},
 3:{t:'Jejak Modal',p:'Jumlah akhir Rp3.360.000 diperoleh dengan bunga tunggal 4% per tahun selama 3 tahun. Berapa modal awal?',ans:'3000000',choices:['Rp2.800.000','Rp3.000.000','Rp3.200.000']},
 4:{t:'Jejak Waktu',p:'Modal awal Rp2.000.000 berkembang dengan bunga tunggal 6% per tahun hingga menjadi Rp2.720.000. Berapa tahun diperlukan?',ans:'6',choices:['4 tahun','5 tahun','6 tahun']}
 }[n];
 return `<div class="card"><span class="status">GERBANG ${n} / 4</span><h2>${data.t}</h2><p>${data.p}</p><div class="q"><input id="ga${n}" value="${esc(S.a['ga'+n]||'')}" inputmode="decimal" placeholder="Masukkan jawaban"><div id="ga${n}fb" class="feedback"></div></div><div class="actions"><button class="secondary" onclick="go('gates')">← Daftar Gerbang</button><button onclick="completeGate(${n},'${data.ans}')">${n===4?'Buka jalan ke Challenge':'Selesaikan Gerbang'} →</button></div></div>`}
function completeGate(n,ans){
 const id='ga'+n,v=document.getElementById(id).value.trim().replace(/[^\d.-]/g,'');
 S.a[id]=document.getElementById(id).value;
 if(v!==ans){document.getElementById(id+'fb').textContent='Periksa lagi';document.getElementById(id+'fb').className='feedback bad';tone('bad');storageSet(JSON.stringify(S));syncFirebase();return}
 S.done[n-1]=true;storageSet(JSON.stringify(S));syncFirebase();tone('ok');toast('Gerbang '+n+' terbuka 🔓');
 if(n===4)go('challenge');else go('gates');
}

function challenge(){return `<div class="card"><span class="status">OPSIONAL</span><h2>🧩 Challenge</h2><p>Bagian ini adalah tantangan tambahan. <b>Tidak wajib</b> untuk menuju Final Quest.</p>
${numQ('ch1','Tantangan 1: Jika modal Rp6.000.000 menghasilkan bunga Rp540.000 dengan i = 3% per tahun, berapa tahun? (jawab 1.5 untuk 1,5)','1.5')}
${numQ('ch2','Tantangan 2: Jika bunga Rp750.000 dari modal Rp5.000.000 selama 5 tahun, berapa i dalam persen? (jawab 3 atau 3%)','2.5')}
<div class="actions"><span></span><button onclick="go('final')">Lewati / Lanjut Final Quest →</button></div></div>`}

function final(){return `<div class="card"><h2>🏁 Final Quest</h2><p>Gunakan konsep yang sudah kalian temukan. Jawaban akhir menjadi bagian dari kunci rahasia.</p>
<div class="q"><h3>1. Sebuah modal Rp2.000.000 diberi bunga tunggal 5% per tahun selama 2 tahun. Berapa nilai bunga dalam persen dari modal?</h3>
<input id="f1" value="${esc(S.a.f1||'')}" inputmode="decimal" placeholder="Contoh: 5"><div class="feedback">Masukkan angka persen tanpa tanda %.</div></div>
<div class="q"><h3>2. Pilih pernyataan yang benar.</h3>${qRadio('f2','Pernyataan',[{v:'tetap',t:'Pada bunga tunggal, bunga tiap periode dihitung dari modal awal.'},{v:'berubah',t:'Pada bunga tunggal, bunga selalu dihitung dari jumlah akhir sebelumnya.'}],'tetap')}</div>
<div class="actions"><span></span><button onclick="finish()">Kunci Jawaban & Lanjut →</button></div></div>`}
function finish(){
 const v=document.getElementById('f1').value.trim(),r=document.querySelector('input[name="f2"]:checked');
 S.a.f1=v;S.a.f2=r?r.value:'';
